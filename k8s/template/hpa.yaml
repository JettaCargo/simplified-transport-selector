apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: VAR_NAME-VAR_ENV
  labels:
    app: VAR_NAME
    env: VAR_ENV
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: VAR_NAME-VAR_ENV
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

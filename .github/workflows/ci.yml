name: CI

on:
  push:
    branches: [dev, stage, main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCOUNT_ID: "329521032930"
  ECR_REPOSITORY: simplified-transport-selector
  PROJECT_NAME: simplified-transport-selector
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::329521032930:role/github-actions-simplified-transport-selector-deploy

permissions:
  contents: read

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  resolve-env:
    name: Resolve deploy env
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          chmod +x scripts/ci_resolve_env.sh
          env_name="$(scripts/ci_resolve_env.sh)"
          echo "env_name=${env_name}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    needs: [verify, resolve-env]
    if: >-
      github.event_name == 'push' &&
      needs.verify.result == 'success' &&
      needs.resolve-env.outputs.env_name != 'none'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Ensure ECR repository exists
        run: |
          chmod +x scripts/ci_ensure_ecr_repository.sh
          scripts/ci_ensure_ecr_repository.sh
      - name: Login to Amazon ECR
        run: |
          chmod +x scripts/ci_docker_ecr_login.sh
          scripts/ci_docker_ecr_login.sh
      - name: Build, smoke test, and push image
        env:
          ENV: ${{ needs.resolve-env.outputs.env_name }}
          ECR_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
        run: |
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          image_tag="${ENV}-${short_sha}"
          docker build --file container/Dockerfile --tag "${ECR_URI}:${image_tag}" --tag "${ECR_URI}:${ENV}" .
          chmod +x scripts/ci_image_smoke_test.sh
          IMAGE="${ECR_URI}:${ENV}" scripts/ci_image_smoke_test.sh
          docker push "${ECR_URI}:${image_tag}"
          docker push "${ECR_URI}:${ENV}"
      - name: Configure kubeconfig and deploy
        env:
          ENV: ${{ needs.resolve-env.outputs.env_name }}
          IMAGE_TAG: ${{ needs.resolve-env.outputs.env_name }}
          CLUSTER_NAME: prod
          PROJECT_NAME: simplified-transport-selector
        run: |
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_DEFAULT_REGION}"
          chmod +x scripts/ci_k8s_apply.sh scripts/ci_k8s_resolve_app_env.sh
          scripts/ci_k8s_apply.sh
